name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anabuki
          POSTGRES_PASSWORD: anabuki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anabuki"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Check unique migration versions
        run: |
          set -euo pipefail
          duplicates=$(find db/migrate -maxdepth 1 -type f -name '*.rb' -printf '%f\n' \
            | sed -nE 's/^([0-9]{14})_.+\.rb$/\1/p' \
            | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            printf '%s\n' "$duplicates" | sed 's/^/::error::Duplicate migration version: /'
            exit 1
          fi
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Security scan
        run: bundle exec brakeman --no-pager
      - name: Lint
        run: bundle exec rubocop -f github
      - name: Zeitwerk
        env:
          RAILS_ENV: test
        run: bundle exec rails zeitwerk:check
      - name: RSpec
        env:
          RAILS_ENV: test
          DATABASE_URL: postgresql://anabuki:anabuki@localhost:5432/anabuki_event_rails_test
        run: bundle exec rails db:prepare && bundle exec rspec
      - name: Test deployment lifecycle without Docker
        run: |
          bash -n deploy/ec2/deploy.sh
          python3 deploy/ec2/test_deploy.py
      - name: Validate production Compose definition
        run: |
          set -euo pipefail
          touch deploy/ec2/.env.production deploy/ec2/.cloudflared.env
          docker compose -f deploy/ec2/docker-compose.production.yml config --quiet
          rm -f deploy/ec2/.env.production deploy/ec2/.cloudflared.env

  notify-parent:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Skip dispatch for a stale main commit
        id: main_guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest_main_sha=$(curl --fail-with-body --silent --show-error \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" | jq --raw-output '.object.sha')
          if [ "$EXPECTED_SHA" = "$latest_main_sha" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch successful Rails main commit
        if: steps.main_guard.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARENT_REPOSITORY_TOKEN: ${{ secrets.PARENT_REPOSITORY_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$PARENT_REPOSITORY_TOKEN" ]; then
            echo "::warning::PARENT_REPOSITORY_TOKEN is not configured; skipping parent update."
            exit 0
          fi
          curl --fail-with-body --request POST \
            --url "https://api.github.com/repos/Anabuki-AI/anabuki-event/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PARENT_REPOSITORY_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"event_type\":\"submodule-main-succeeded\",\"client_payload\":{\"repository\":\"Anabuki-AI/anabuki-event-backend-rails\",\"sha\":\"${SHA}\"}}"

  deploy-production:
    name: Deploy Rails and Que to EC2 through Cloudflare Tunnel
    needs: check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ec2-backend-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY }}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      ADMIN_EMAIL_ALLOWLIST: ${{ secrets.ADMIN_EMAIL_ALLOWLIST }}
      OPERATOR_EMAIL_ALLOWLIST: ${{ secrets.OPERATOR_EMAIL_ALLOWLIST }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
      ADMIN_FRONTEND_URL: ${{ secrets.ADMIN_FRONTEND_URL }}
      OPERATOR_FRONTEND_URL: ${{ secrets.OPERATOR_FRONTEND_URL }}
      GOOGLE_OAUTH_CALLBACK_URL: ${{ secrets.GOOGLE_OAUTH_CALLBACK_URL }}
      OPERATOR_GOOGLE_OAUTH_CALLBACK_URL: ${{ secrets.OPERATOR_GOOGLE_OAUTH_CALLBACK_URL }}
      ADDITIONAL_ALLOWED_ORIGINS: ${{ secrets.ADDITIONAL_ALLOWED_ORIGINS }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate deployment inputs without printing secret values
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID EC2_SSH_PRIVATE_KEY EC2_KNOWN_HOSTS DATABASE_URL SECRET_KEY_BASE ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET PUBLIC_BASE_URL ADMIN_FRONTEND_URL OPERATOR_FRONTEND_URL GOOGLE_OAUTH_CALLBACK_URL OPERATOR_GOOGLE_OAUTH_CALLBACK_URL R2_ENDPOINT R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in the production environment"
              exit 1
            fi
          done

      - name: Prepare isolated SSH credentials
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ec2-key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$RUNNER_TEMP/ec2-known-hosts"
          chmod 600 "$RUNNER_TEMP/ec2-key" "$RUNNER_TEMP/ec2-known-hosts"
          eval "$(ssh-agent -s)"
          ssh-add "$RUNNER_TEMP/ec2-key"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Open SSH channel through Cloudflare Tunnel
        # The EC2 public IP changes on stop/start, and SSH must not depend on
        # it. All deploy traffic rides the outbound-only Cloudflare Tunnel
        # (ssh.anabuki-event.com), so reboots and IP changes are transparent.
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/download/2025.9.1/cloudflared-linux-amd64
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" access tcp \
            --hostname ssh.anabuki-event.com \
            --url 127.0.0.1:2222 > "$RUNNER_TEMP/cloudflared-access.log" 2>&1 &
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/2222) 2>/dev/null; then
              echo "tunnel ssh channel ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Cloudflare Tunnel SSH channel did not open; see $RUNNER_TEMP/cloudflared-access.log"
          exit 1

      - name: Preflight Cloudflare account, zone, and Tunnel read scope
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          cf_config="$RUNNER_TEMP/cloudflare-curl.conf"
          printf 'silent\nshow-error\nfail-with-body\nheader = "Authorization: Bearer %s"\nheader = "Accept: application/json"\n' "$CF_API_TOKEN" > "$cf_config"
          chmod 600 "$cf_config"
          # The production token is account-owned (cfat_), so token
          # verification must use the account-scoped endpoint; the user
          # endpoint answers 401 for account-owned tokens.
          verify=$(curl --config "$cf_config" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/tokens/verify")
          test "$(jq -r '.success' <<<"$verify")" = true
          account=$(curl --config "$cf_config" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID")
          test "$(jq -r '.success' <<<"$account")" = true
          zone=$(curl --config "$cf_config" "https://api.cloudflare.com/client/v4/zones?name=anabuki-event.com&status=active")
          test "$(jq -r '.success' <<<"$zone")" = true
          test "$(jq -r '.result | length' <<<"$zone")" = 1
          tunnels=$(curl --config "$cf_config" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/cfd_tunnel?name=anabuki-event-api&is_deleted=false")
          test "$(jq -r '.success' <<<"$tunnels")" = true || {
            echo "::error::Cloudflare API token cannot read Cloudflare Tunnels; no resource mutation was attempted. Grant Account Cloudflare Tunnel:Read/Edit and retry."
            exit 1
          }
          rm -f "$cf_config"

      - name: Ensure remotely managed tunnel, ingress, and DNS route
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -Eeuo pipefail
          umask 077
          cf_config="$RUNNER_TEMP/cloudflare-curl.conf"
          printf 'silent\nshow-error\nfail-with-body\nheader = "Authorization: Bearer %s"\nheader = "Accept: application/json"\nheader = "Content-Type: application/json"\n' "$CF_API_TOKEN" > "$cf_config"
          chmod 600 "$cf_config"
          api="https://api.cloudflare.com/client/v4"
          tunnel_name='anabuki-event-api'
          hostname='api.anabuki-event.com'
          tunnels=$(curl --config "$cf_config" "$api/accounts/$CF_ACCOUNT_ID/cfd_tunnel?name=$tunnel_name&is_deleted=false")
          tunnel_id=$(jq -r '.result[0].id // empty' <<<"$tunnels")
          if [ -z "$tunnel_id" ]; then
            tunnel_secret="$RUNNER_TEMP/tunnel-secret"
            openssl rand -base64 32 | tr -d '\n' > "$tunnel_secret"
            payload="$RUNNER_TEMP/tunnel-create.json"
            jq -n --arg name "$tunnel_name" --rawfile secret "$tunnel_secret" '{name:$name,tunnel_secret:$secret,config_src:"cloudflare"}' > "$payload"
            created=$(curl --config "$cf_config" --request POST --data-binary "@$payload" "$api/accounts/$CF_ACCOUNT_ID/cfd_tunnel")
            test "$(jq -r '.success' <<<"$created")" = true
            tunnel_id=$(jq -r '.result.id // empty' <<<"$created")
            test -n "$tunnel_id"
            rm -f "$tunnel_secret" "$payload"
          fi
          config_payload="$RUNNER_TEMP/tunnel-config.json"
          # 172.17.0.1 is the host-side docker0 gateway: reachable from the
          # cloudflared container, and unaffected by instance IP changes.
          jq -n '{config:{ingress:[{hostname:"api.anabuki-event.com",service:"http://api:3000"},{hostname:"ssh.anabuki-event.com",service:"ssh://172.17.0.1:22"},{service:"http_status:404"}]}}' > "$config_payload"
          configured=$(curl --config "$cf_config" --request PUT --data-binary "@$config_payload" "$api/accounts/$CF_ACCOUNT_ID/cfd_tunnel/$tunnel_id/configurations")
          test "$(jq -r '.success' <<<"$configured")" = true
          zone=$(curl --config "$cf_config" "$api/zones?name=anabuki-event.com&status=active")
          zone_id=$(jq -r '.result[0].id // empty' <<<"$zone")
          test -n "$zone_id"
          record=$(curl --config "$cf_config" "$api/zones/$zone_id/dns_records?type=CNAME&name=$hostname")
          record_id=$(jq -r '.result[0].id // empty' <<<"$record")
          dns_payload="$RUNNER_TEMP/tunnel-dns.json"
          jq -n --arg name "$hostname" --arg content "$tunnel_id.cfargotunnel.com" '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:true}' > "$dns_payload"
          if [ -n "$record_id" ]; then
            updated=$(curl --config "$cf_config" --request PUT --data-binary "@$dns_payload" "$api/zones/$zone_id/dns_records/$record_id")
          else
            updated=$(curl --config "$cf_config" --request POST --data-binary "@$dns_payload" "$api/zones/$zone_id/dns_records")
          fi
          test "$(jq -r '.success' <<<"$updated")" = true
          if [ -n "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]; then
            printf '%s' "$CLOUDFLARE_TUNNEL_TOKEN" > "$RUNNER_TEMP/tunnel-token"
          else
            curl --config "$cf_config" "$api/accounts/$CF_ACCOUNT_ID/cfd_tunnel/$tunnel_id/token" | jq -r '.result' > "$RUNNER_TEMP/tunnel-token"
          fi
          test -s "$RUNNER_TEMP/tunnel-token"
          chmod 600 "$RUNNER_TEMP/tunnel-token"
          rm -f "$cf_config" "$config_payload" "$dns_payload"

      - name: Provision Docker and least-privilege EC2 deploy user
        run: |
          set -euo pipefail
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ec2-known-hosts")
          ssh -p 2222 "${ssh_opts[@]}" ec2-user@127.0.0.1 'sudo dnf install -y docker && sudo install -d -m 0755 /usr/local/lib/docker/cli-plugins && sudo curl --fail --silent --show-error --location --output /usr/local/lib/docker/cli-plugins/docker-compose https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 && sudo chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose && sudo systemctl enable --now docker && sudo useradd --create-home --shell /bin/bash anabuki-deploy 2>/dev/null || true && sudo usermod --append --groups docker anabuki-deploy && sudo install -d -o anabuki-deploy -g anabuki-deploy -m 0750 /opt/anabuki-event /opt/anabuki-event/incoming /opt/anabuki-event/releases /opt/anabuki-event/shared /opt/anabuki-event/staging && sudo install -d -o anabuki-deploy -g anabuki-deploy -m 0700 /home/anabuki-deploy/.ssh'
          ssh-keygen -y -f "$RUNNER_TEMP/ec2-key" > "$RUNNER_TEMP/ec2-public-key"
          ssh -p 2222 "${ssh_opts[@]}" ec2-user@127.0.0.1 'sudo tee /home/anabuki-deploy/.ssh/authorized_keys >/dev/null && sudo chown -R anabuki-deploy:anabuki-deploy /home/anabuki-deploy/.ssh && sudo chmod 600 /home/anabuki-deploy/.ssh/authorized_keys' < "$RUNNER_TEMP/ec2-public-key"
          ssh -p 2222 "${ssh_opts[@]}" -o IdentitiesOnly=no anabuki-deploy@127.0.0.1 'docker compose version >/dev/null && test -w /opt/anabuki-event'

      - name: Write production runtime files to runner temp storage
        run: |
          set -euo pipefail
          umask 077
          env_file="$RUNNER_TEMP/backend.env"
          {
            printf 'RAILS_ENV=production\nPORT=3000\nRAILS_LOG_TO_STDOUT=true\nRAILS_MAX_THREADS=5\nQUE_WORKER_COUNT=3\nACTIVE_STORAGE_SERVICE=r2\nR2_REGION=auto\n'
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'SECRET_KEY_BASE=%s\n' "$SECRET_KEY_BASE"
            printf 'ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=%s\n' "$ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY"
            printf 'ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=%s\n' "$ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY"
            printf 'ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=%s\n' "$ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT"
            printf 'GOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET"
            printf 'ADMIN_EMAIL_ALLOWLIST=%s\nOPERATOR_EMAIL_ALLOWLIST=%s\n' "$ADMIN_EMAIL_ALLOWLIST" "$OPERATOR_EMAIL_ALLOWLIST"
            printf 'PUBLIC_BASE_URL=%s\nADMIN_FRONTEND_URL=%s\nOPERATOR_FRONTEND_URL=%s\n' "$PUBLIC_BASE_URL" "$ADMIN_FRONTEND_URL" "$OPERATOR_FRONTEND_URL"
            printf 'GOOGLE_OAUTH_CALLBACK_URL=%s\nOPERATOR_GOOGLE_OAUTH_CALLBACK_URL=%s\n' "$GOOGLE_OAUTH_CALLBACK_URL" "$OPERATOR_GOOGLE_OAUTH_CALLBACK_URL"
            printf 'ADDITIONAL_ALLOWED_ORIGINS=%s\n' "$ADDITIONAL_ALLOWED_ORIGINS"
            printf 'R2_ENDPOINT=%s\nR2_BUCKET=%s\nR2_ACCESS_KEY_ID=%s\nR2_SECRET_ACCESS_KEY=%s\n' "$R2_ENDPOINT" "$R2_BUCKET" "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY"
            if [ -n "${OPENROUTER_API_KEY:-}" ]; then printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY"; fi
          } > "$env_file"
          printf 'TUNNEL_TOKEN=%s\n' "$(<"$RUNNER_TEMP/tunnel-token")" > "$RUNNER_TEMP/cloudflared.env"
          chmod 600 "$env_file" "$RUNNER_TEMP/cloudflared.env"

      - name: Upload release and private runtime files
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/release.tar.gz"
          tar --exclude=.git --exclude=tmp --exclude=log --exclude=storage --exclude=.env -czf "$archive" .
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ec2-known-hosts")
          ssh -p 2222 "${ssh_opts[@]}" anabuki-deploy@127.0.0.1 "install -m 600 /dev/stdin /opt/anabuki-event/shared/.env.production" < "$RUNNER_TEMP/backend.env"
          ssh -p 2222 "${ssh_opts[@]}" anabuki-deploy@127.0.0.1 "install -m 600 /dev/stdin /opt/anabuki-event/shared/.cloudflared.env" < "$RUNNER_TEMP/cloudflared.env"
          scp -P 2222 "${ssh_opts[@]}" "$archive" anabuki-deploy@127.0.0.1:/opt/anabuki-event/incoming/${GITHUB_SHA}.tar.gz

      - name: Activate release without running migrations
        run: |
          set -euo pipefail
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ec2-known-hosts")
          ssh -p 2222 "${ssh_opts[@]}" anabuki-deploy@127.0.0.1 "set -euo pipefail; staging=/opt/anabuki-event/staging/${GITHUB_SHA}; rm -rf \"\$staging\"; mkdir -p \"\$staging\"; tar --extract --gzip --file /opt/anabuki-event/incoming/${GITHUB_SHA}.tar.gz --directory \"\$staging\"; RELEASE_SHA=${GITHUB_SHA} ARCHIVE_PATH=/opt/anabuki-event/incoming/${GITHUB_SHA}.tar.gz APP_ROOT=/opt/anabuki-event bash \"\$staging/deploy/ec2/deploy.sh\""

      - name: Verify public tunnel health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            --max-time 20 https://api.anabuki-event.com/health

      - name: Prove Rails is not listening on the EC2 host port
        run: |
          set -euo pipefail
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ec2-known-hosts")
          listeners=$(ssh -p 2222 "${ssh_opts[@]}" anabuki-deploy@127.0.0.1 "ss -ltn 2>/dev/null || true")
          if grep -Eq '(^|:)3000[[:space:]]' <<<"$listeners"; then
            echo "::error::EC2 host port 3000 is listening; Rails must remain private to the Docker network"
            exit 1
          fi
          printf '%s\n' "$listeners"
