name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a run that may already be deploying production. The deploy
# job has its own non-canceling production lock below.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anabuki
          POSTGRES_PASSWORD: anabuki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anabuki"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Security scan
        run: bundle exec brakeman --no-pager
      - name: Lint
        run: bundle exec rubocop -f github
      - name: Zeitwerk
        env:
          RAILS_ENV: test
        run: bundle exec rails zeitwerk:check
      - name: RSpec
        env:
          RAILS_ENV: test
          DATABASE_URL: postgresql://anabuki:anabuki@localhost:5432/anabuki_event_rails_test
        run: bundle exec rails db:prepare && bundle exec rspec

  notify-parent:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Skip parent update for a stale main commit
        id: main_guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest_main_sha=$(curl --fail-with-body --silent --show-error \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" | jq --raw-output '.object.sha')
          if [ "$EXPECTED_SHA" = "$latest_main_sha" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "${EXPECTED_SHA} is no longer the tip of main; skipping parent update."
          fi
      - name: Dispatch successful Rails main commit
        if: steps.main_guard.outputs.current == 'true'
        env:
          PARENT_REPOSITORY_TOKEN: ${{ secrets.PARENT_REPOSITORY_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$PARENT_REPOSITORY_TOKEN" ]; then
            echo "::warning::PARENT_REPOSITORY_TOKEN is not configured; skipping parent update."
            exit 0
          fi
          curl --fail-with-body --request POST \
            --url "https://api.github.com/repos/Anabuki-AI/anabuki-event/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PARENT_REPOSITORY_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"event_type\":\"submodule-main-succeeded\",\"client_payload\":{\"repository\":\"Anabuki-AI/anabuki-event-backend-rails\",\"sha\":\"${SHA}\"}}"

  deploy-production:
    name: Deploy Rails Container to Cloudflare
    needs: check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cloudflare-backend-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Guard against deploying an old main commit
        id: main_guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest_main_sha=$(curl --fail-with-body --silent --show-error \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" | jq --raw-output '.object.sha')
          if [ "$EXPECTED_SHA" = "$latest_main_sha" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "${EXPECTED_SHA} is no longer the tip of main; skipping deployment."
          fi
      - name: Validate Cloudflare deployment credentials
        if: steps.main_guard.outputs.current == 'true'
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
      - name: Install Wrangler and Containers SDK
        if: steps.main_guard.outputs.current == 'true'
        working-directory: cloudflare
        run: npm ci
      - name: Confirm Docker is available for the Container image
        if: steps.main_guard.outputs.current == 'true'
        run: docker info
      - name: Deploy Worker and Rails Container
        if: steps.main_guard.outputs.current == 'true'
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Install configured Rails Worker secrets
        if: steps.main_guard.outputs.current == 'true'
        working-directory: cloudflare
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPERATOR_DATABASE_URL: ${{ secrets.OPERATOR_DATABASE_URL }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAIL_ALLOWLIST: ${{ secrets.ADMIN_EMAIL_ALLOWLIST }}
          OPERATOR_EMAIL_ALLOWLIST: ${{ secrets.OPERATOR_EMAIL_ALLOWLIST }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          ADMIN_FRONTEND_URL: ${{ secrets.ADMIN_FRONTEND_URL }}
          OPERATOR_FRONTEND_URL: ${{ secrets.OPERATOR_FRONTEND_URL }}
          GOOGLE_OAUTH_CALLBACK_URL: ${{ secrets.GOOGLE_OAUTH_CALLBACK_URL }}
          OPERATOR_GOOGLE_OAUTH_CALLBACK_URL: ${{ secrets.OPERATOR_GOOGLE_OAUTH_CALLBACK_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "${name} is not configured in the production environment; leaving the Worker secret unset."
              return 0
            fi
            printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.jsonc
          }

          put_secret DATABASE_URL "$DATABASE_URL"
          put_secret OPERATOR_DATABASE_URL "$OPERATOR_DATABASE_URL"
          put_secret SECRET_KEY_BASE "$SECRET_KEY_BASE"
          put_secret GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          put_secret GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          put_secret ADMIN_EMAIL_ALLOWLIST "$ADMIN_EMAIL_ALLOWLIST"
          put_secret OPERATOR_EMAIL_ALLOWLIST "$OPERATOR_EMAIL_ALLOWLIST"
          put_secret PUBLIC_BASE_URL "$PUBLIC_BASE_URL"
          put_secret ADMIN_FRONTEND_URL "$ADMIN_FRONTEND_URL"
          put_secret OPERATOR_FRONTEND_URL "$OPERATOR_FRONTEND_URL"
          put_secret GOOGLE_OAUTH_CALLBACK_URL "$GOOGLE_OAUTH_CALLBACK_URL"
          put_secret OPERATOR_GOOGLE_OAUTH_CALLBACK_URL "$OPERATOR_GOOGLE_OAUTH_CALLBACK_URL"
          put_secret R2_ENDPOINT "$R2_ENDPOINT"
          put_secret R2_BUCKET "$R2_BUCKET"
          put_secret R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID"
          put_secret R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"
