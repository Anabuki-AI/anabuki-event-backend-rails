default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  # Keep this YAML value null when DATABASE_URL is absent.  The literal string
  # "nil" is interpreted as a database URL and makes Rails try to use a
  # database named "nil".
  url: <%= ENV["DATABASE_URL"].presence %>

development:
  <<: *default
  database: anabuki_event_rails_development
  username: <%= ENV.fetch("POSTGRES_USER", "anabuki") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "anabuki") %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>

test:
  <<: *default
  database: anabuki_event_rails_test
  username: <%= ENV.fetch("POSTGRES_USER", "anabuki") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "anabuki") %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "anabuki_event_rails_production") %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>
  host: <%= ENV["POSTGRES_HOST"] %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
