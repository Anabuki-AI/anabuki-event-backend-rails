x-rails-environment: &rails-environment
  RAILS_ENV: development
  RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
  DATABASE_URL: postgresql://${POSTGRES_USER:-anabuki}:${POSTGRES_PASSWORD:-anabuki}@postgres:5432/anabuki_event_rails_development
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
  ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL:-http://localhost:3000/admin}
  GOOGLE_OAUTH_CALLBACK_URL: ${GOOGLE_OAUTH_CALLBACK_URL:-http://localhost:8080/api/auth/google/callback}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  ADMIN_EMAIL_ALLOWLIST: ${ADMIN_EMAIL_ALLOWLIST:-}
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:-development-only-secret-key-base-do-not-use-in-production}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  SENTRY_ENABLED_ENVIRONMENTS: ${SENTRY_ENABLED_ENVIRONMENTS:-production}

services:
  postgres:
    image: postgres:16-alpine
    container_name: anabuki-event-rails-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: anabuki_event_rails_development
      POSTGRES_USER: ${POSTGRES_USER:-anabuki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anabuki}
    volumes:
      - rails-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-prepare:
    build:
      context: .
      target: development
    image: anabuki-event-backend-rails
    environment: *rails-environment
    command: ["bundle", "exec", "rails", "db:prepare"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: development
    image: anabuki-event-backend-rails
    ports:
      - "8080:8080"
    environment:
      <<: *rails-environment
      PORT: 8080
    command: ["bundle", "exec", "rails", "server", "-b", "0.0.0.0", "-p", "8080"]
    depends_on:
      db-prepare:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: development
    image: anabuki-event-backend-rails
    environment: *rails-environment
    command:
      - bundle
      - exec
      - que
      - --worker-count
      - ${QUE_WORKER_COUNT:-3}
      - --queue-name
      - default
      - --queue-name
      - mailers
      - --queue-name
      - action_mailbox_incineration
      - --queue-name
      - action_mailbox_routing
      - --queue-name
      - active_storage_analysis
      - --queue-name
      - active_storage_purge
    depends_on:
      db-prepare:
        condition: service_completed_successfully

volumes:
  rails-postgres-data:
